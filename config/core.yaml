# APEX Phase 6 — strategy + backtest configuration
# Auto-generated by scripts/tune.py from walk-forward optimisation.

strategy:
  atr_period: 14
  atr_min: 0.0039      # filter out markets too quiet
  atr_max: 0.0308      # filter out runaway volatility
  momentum_period: 14
  max_spread: 0.0197   # skip bars with spread wider than this
  score_threshold: 0.5792  # |momentum score| needed to generate BUY/SELL

execution:
  initial_cash: 10000.0
  slippage_bps: 5.0
  fee_bps: 5.0
  position_size: 0.10

backtest:
  warmup_bars: 50
  window_size: 200
  walk_forward_splits: 5
  in_sample_fraction: 0.70
